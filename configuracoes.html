<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolarSmart — Configurações</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="ss-layout">

  <aside class="ss-sidebar" id="sidebar">
    <div class="ss-sidebar-logo">
      <a href="index.html" class="ss-logo">Solar<span>Smart</span></a>
    </div>
    <nav class="ss-sidebar-nav">
      <a href="dashboard.html" class="ss-nav-item"><span class="ss-nav-icon">📊</span> Dashboard</a>
      <a href="simulacao.html" class="ss-nav-item"><span class="ss-nav-icon">⚡</span> Simulação</a>
      <a href="relatorios.html" class="ss-nav-item"><span class="ss-nav-icon">📄</span> Relatórios</a>
      <a href="configuracoes.html" class="ss-nav-item active"><span class="ss-nav-icon">⚙️</span> Configurações</a>
    </nav>
    <div class="p-3" style="border-top:1px solid rgba(255,255,255,.07);">
      <a href="index.html" class="ss-nav-item" style="border-radius:10px;"><span class="ss-nav-icon">🚪</span> Sair</a>
    </div>
  </aside>

  <div class="ss-main">
    <header class="ss-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm d-lg-none p-1" onclick="toggleSidebar()" style="border:none;background:none;font-size:1.3rem;">☰</button>
        <span class="ss-topbar-title">Configurações</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span style="color:var(--ss-muted);font-size:.88rem;" class="d-none d-md-block">Olá, Usuário</span>
        <div class="ss-avatar">U</div>
      </div>
    </header>

    <main class="ss-content">
      <div class="ss-card anim-fade-up">
        <div class="ss-empty-state">
          <span class="ss-empty-icon">⚙️</span>
          <h4>Configurações em breve</h4>
          <p>Aqui você poderá personalizar seu perfil, notificações e preferências do sistema.</p>
          <span class="badge px-3 py-2 rounded-pill"
            style="background:var(--ss-accent-light);color:#92400e;border:1px solid rgba(245,158,11,.3);font-size:.82rem;">
            🚧 Disponível em breve
          </span>
        </div>
      </div>
    </main>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }
</script>
</body>
</html>
