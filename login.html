<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolarSmart — Entrar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="ss-login-bg">
    <div class="ss-hero-grid"></div>

    <div class="ss-login-card anim-fade-up">
      <!-- Logo -->
      <div class="text-center mb-4">
        <a href="index.html" class="ss-logo" style="font-size:1.8rem;">Solar<span>Smart</span></a>
        <p class="mt-2 mb-0" style="color:var(--ss-muted);font-size:.9rem;">Entre na sua conta</p>
      </div>

      <!-- Form -->
      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="ss-form-label" for="email">E-mail</label>
          <input
            type="email"
            id="email"
            class="ss-form-control"
            placeholder="seu@email.com"
            required
          />
        </div>

        <div class="mb-4">
          <label class="ss-form-label" for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            class="ss-form-control"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="ss-btn-primary w-100 py-3" style="border-radius:10px;font-size:1rem;">
          Entrar
        </button>
      </form>

      <!-- Divider -->
      <div class="d-flex align-items-center my-4">
        <hr class="flex-grow-1" style="border-color:var(--ss-border);">
        <span class="px-3" style="color:var(--ss-muted);font-size:.82rem;">ou</span>
        <hr class="flex-grow-1" style="border-color:var(--ss-border);">
      </div>

      <!-- Demo hint -->
      <div class="text-center rounded-3 p-3" style="background:var(--ss-accent-light);border:1px solid rgba(245,158,11,.25);">
        <p class="mb-0" style="font-size:.83rem;color:#92400e;">
          <strong>Demo:</strong> use qualquer e-mail e senha para entrar
        </p>
      </div>

      <!-- Back link -->
      <div class="text-center mt-4">
        <a href="index.html" style="color:var(--ss-muted);font-size:.88rem;text-decoration:none;">
          ← Voltar para o início
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
