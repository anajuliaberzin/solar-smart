<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0f1f" />
  <title>SolarSmart — Entrar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="login-page">
  <main class="ss-login-bg">
    <div class="login-glow" aria-hidden="true"></div>
    <section class="ss-login-card" aria-labelledby="login-title">
      <div class="login-heading">
        <a href="index.html" class="ss-logo">Solar<span>Smart</span></a>
        <h1 id="login-title">Entrar</h1>
        <p>Entre na sua conta</p>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="ss-form-label" for="email">E-mail</label>
          <input
            type="email"
            id="email"
            class="ss-form-control"
            placeholder="seu@email.com"
            required
          />
        </div>

        <div class="mb-4">
          <label class="ss-form-label" for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            class="ss-form-control"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="ss-btn-primary w-100 py-3">
          Entrar
        </button>
      </form>

      <div class="login-divider" aria-hidden="true">
        <span></span><p>ou</p><span></span>
      </div>

      <div class="demo-hint">
        <p>
          <strong>Demo:</strong> use qualquer e-mail e senha para entrar
        </p>
      </div>

      <div class="login-back">
        <a href="index.html">← Voltar para o início</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase.js"></script>

  <script src="js/login.js"></script>
</body>
</html>
