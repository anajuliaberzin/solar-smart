<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolarSmart — Ocorrências</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body>

<div class="ss-layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="ss-sidebar" id="sidebar">
    <div class="ss-sidebar-logo">
      <a href="index.html" class="ss-logo">Solar<span>Smart</span></a>
    </div>
    <nav class="ss-sidebar-nav">
      <a href="dashboard.html" class="ss-nav-item">
        <span class="ss-nav-icon"><i class="bi bi-grid"></i></span> Dashboard
      </a>
      <a href="ocorrencias.html" class="ss-nav-item active">
        <span class="ss-nav-icon"><i class="bi bi-bell"></i></span> Ocorrências
      </a>
      <a href="relatorios.html" class="ss-nav-item">
        <span class="ss-nav-icon"><i class="bi bi-bar-chart"></i></span> Relatórios
      </a>
      <a href="configuracoes.html" class="ss-nav-item">
        <span class="ss-nav-icon"><i class="bi bi-gear"></i></span> Configurações
      </a>
      <a href="cliente.html" class="ss-nav-item">
        <span class="ss-nav-icon"><i class="bi bi-house"></i></span> Área do Cliente
      </a>
    </nav>
    <div class="p-3" style="border-top:1px solid rgba(255,255,255,.07);">
      <a href="index.html" class="ss-nav-item" style="border-radius:10px;">
        <span class="ss-nav-icon"><i class="bi bi-box-arrow-left"></i></span> Sair
      </a>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="ss-main">

    <!-- TOPBAR -->
    <header class="ss-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm d-lg-none p-1" onclick="toggleSidebar()" style="border:none;background:none;font-size:1.1rem;color:var(--ss-muted);"><i class="bi bi-list"></i></button>
        <span class="ss-topbar-title">Ocorrências</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span style="color:var(--ss-muted);font-size:.88rem;" class="d-none d-md-block">Olá, Usuário</span>
        <div class="ss-avatar">U</div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="ss-content">

      <!-- Formulário -->
      <div class="ss-card p-4 mb-4 anim-fade-up">
        <h5 class="fw-bold mb-1" style="font-family:var(--font-display);">Registrar nova ocorrência</h5>
        <p class="mb-4" style="color:var(--ss-muted);font-size:.88rem;">Preencha os campos abaixo para registrar um evento no sistema.</p>

        <form id="formOcorrencia" onsubmit="registrarOcorrencia(event)">
          <div class="row g-3">

            <div class="col-md-6">
              <label class="ss-form-label" for="oc-datetime">Data e hora</label>
              <input type="datetime-local" id="oc-datetime" class="ss-form-control" required />
            </div>

            <div class="col-md-6">
              <label class="ss-form-label" for="oc-painel">Painel afetado</label>
              <select id="oc-painel" class="ss-form-control" required>
                <option value="" disabled selected>Selecione o painel...</option>
                <option value="Painel A">Painel A</option>
                <option value="Painel B">Painel B</option>
                <option value="Painel C">Painel C</option>
                <option value="Painel D">Painel D</option>
                <option value="Todos">Todos</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="ss-form-label" for="oc-tipo">Tipo de evento</label>
              <select id="oc-tipo" class="ss-form-control" required>
                <option value="" disabled selected>Selecione o tipo...</option>
                <option value="Sujeira">Sujeira</option>
                <option value="Falha técnica">Falha técnica</option>
                <option value="Interferência animal">Interferência animal</option>
                <option value="Sombreamento">Sombreamento</option>
                <option value="Manutenção preventiva">Manutenção preventiva</option>
                <option value="Outro">Outro</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="ss-form-label" for="oc-severidade">Severidade</label>
              <select id="oc-severidade" class="ss-form-control" required>
                <option value="" disabled selected>Selecione a severidade...</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
              </select>
            </div>

            <div class="col-12">
              <label class="ss-form-label" for="oc-descricao">Descrição</label>
              <textarea id="oc-descricao" class="ss-form-control" rows="3"
                placeholder="Descreva detalhes da ocorrência..." required
                style="resize:vertical;"></textarea>
            </div>

            <div class="col-12">
              <button type="submit" class="ss-btn-primary" style="border-radius:10px;padding:.75rem 2rem;">
                <i class="bi bi-bell" style="margin-right:.4rem;"></i>Registrar ocorrência
              </button>
            </div>

          </div>
        </form>
      </div>

      <!-- Tabela de ocorrências -->
      <div class="ss-card p-4 anim-fade-up anim-delay-1">
        <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
          <h5 class="fw-bold mb-0" style="font-family:var(--font-display);">Ocorrências registradas</h5>
          <span class="badge rounded-pill px-3 py-2" id="badge-total"
            style="background:rgba(30,95,180,.1);color:var(--ss-blue-brand);font-family:var(--font-body);font-size:.82rem;">
            5 registros
          </span>
        </div>

        <div class="table-responsive">
          <table class="table align-middle" style="font-size:.9rem;">
            <thead>
              <tr style="border-bottom:2px solid var(--ss-border);">
                <th style="font-family:var(--font-display);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ss-muted);font-weight:600;padding:.75rem 1rem;white-space:nowrap;">Data/Hora</th>
                <th style="font-family:var(--font-display);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ss-muted);font-weight:600;padding:.75rem 1rem;">Painel</th>
                <th style="font-family:var(--font-display);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ss-muted);font-weight:600;padding:.75rem 1rem;">Tipo</th>
                <th style="font-family:var(--font-display);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ss-muted);font-weight:600;padding:.75rem 1rem;">Severidade</th>
                <th style="font-family:var(--font-display);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ss-muted);font-weight:600;padding:.75rem 1rem;">Descrição</th>
                <th style="font-family:var(--font-display);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ss-muted);font-weight:600;padding:.75rem 1rem;">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-ocorrencias">
              <!-- Preenchido via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div><!-- /ss-main -->

</div><!-- /ss-layout -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  // Dados mock iniciais
  let ocorrencias = [
    { id: 1, datetime: '2026-04-25T09:14', painel: 'Painel B', tipo: 'Sujeira', severidade: 'Média', descricao: 'Acúmulo de poeira após período seco prolongado.' },
    { id: 2, datetime: '2026-04-22T14:30', painel: 'Painel D', tipo: 'Falha técnica', severidade: 'Alta', descricao: 'Queda de tensão no inversor detectada pelo sistema.' },
    { id: 3, datetime: '2026-04-20T11:00', painel: 'Todos', tipo: 'Sombreamento', severidade: 'Baixa', descricao: 'Nuvens espessas durante a manhã reduziram geração em 30%.' },
    { id: 4, datetime: '2026-04-18T08:45', painel: 'Painel A', tipo: 'Interferência animal', severidade: 'Baixa', descricao: 'Presença de pombos sobre os módulos fotovoltaicos.' },
    { id: 5, datetime: '2026-04-15T16:20', painel: 'Painel C', tipo: 'Manutenção preventiva', severidade: 'Média', descricao: 'Limpeza programada dos módulos e verificação de conectores.' },
  ];

  let nextId = 6;

  function severidadeBadge(sev) {
    const map = {
      'Baixa':  { bg: '#dcfce7', color: '#166534', border: '#bbf7d0' },
      'Média':  { bg: '#fef9c3', color: '#854d0e', border: '#fef08a' },
      'Alta':   { bg: '#fee2e2', color: '#991b1b', border: '#fecaca' },
    };
    const s = map[sev] || { bg: '#f1f5f9', color: '#475569', border: '#e2e8f0' };
    return `<span class="badge rounded-pill px-2 py-1" style="background:${s.bg};color:${s.color};border:1px solid ${s.border};font-size:.78rem;font-family:var(--font-body);">${sev}</span>`;
  }

  function fmtDatetime(dt) {
    const d = new Date(dt);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function renderTabela() {
    const tbody = document.getElementById('tabela-ocorrencias');
    if (ocorrencias.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4" style="color:var(--ss-muted);">Nenhuma ocorrência registrada.</td></tr>`;
      document.getElementById('badge-total').textContent = '0 registros';
      return;
    }
    document.getElementById('badge-total').textContent = ocorrencias.length + (ocorrencias.length === 1 ? ' registro' : ' registros');
    tbody.innerHTML = ocorrencias.map(oc => `
      <tr style="border-bottom:1px solid var(--ss-border);">
        <td style="padding:.75rem 1rem;white-space:nowrap;color:var(--ss-muted);">${fmtDatetime(oc.datetime)}</td>
        <td style="padding:.75rem 1rem;font-weight:500;">${oc.painel}</td>
        <td style="padding:.75rem 1rem;">${oc.tipo}</td>
        <td style="padding:.75rem 1rem;">${severidadeBadge(oc.severidade)}</td>
        <td style="padding:.75rem 1rem;color:var(--ss-muted);max-width:260px;">${oc.descricao}</td>
        <td style="padding:.75rem 1rem;">
          <button class="btn btn-sm" onclick="excluirOcorrencia(${oc.id})"
            style="background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:8px;font-size:.8rem;font-family:var(--font-body);padding:.3rem .8rem;">
            Excluir
          </button>
        </td>
      </tr>
    `).join('');
  }

  function excluirOcorrencia(id) {
    ocorrencias = ocorrencias.filter(oc => oc.id !== id);
    renderTabela();
  }

  function registrarOcorrencia(e) {
    e.preventDefault();
    const nova = {
      id: nextId++,
      datetime:   document.getElementById('oc-datetime').value,
      painel:     document.getElementById('oc-painel').value,
      tipo:       document.getElementById('oc-tipo').value,
      severidade: document.getElementById('oc-severidade').value,
      descricao:  document.getElementById('oc-descricao').value.trim(),
    };
    ocorrencias.unshift(nova);
    renderTabela();
    document.getElementById('formOcorrencia').reset();
  }

  // Preencher datetime com valor atual por padrão
  (function() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const local = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
    document.getElementById('oc-datetime').value = local;
  })();

  renderTabela();
</script>
</body>
</html>
